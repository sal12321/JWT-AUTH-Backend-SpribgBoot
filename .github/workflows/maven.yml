# simply detect the push in main branch and do the job [build the jar and just run..]

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package
      
    - name: Stage JAR as app.jar
      run: |
          # Copy the compiled artifact to target/app.jar
          cp target/jwt_learning-0.0.1-SNAPSHOT.jar target/app.jar
          ls -lh target/app.jar
          

    - name: Copy JAR to EC2 (overwrites existing app.jar)
      uses: appleboy/scp-action@v0.1.7
      with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/app.jar"
          target: "/home/ubuntu"
          strip_components: 1

    - name: Restart jwt-auth service
      uses: appleboy/ssh-action@v1.0.3
      with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart jwt-auth
            sleep 4
            sudo systemctl status jwt-auth --no-pager
   
