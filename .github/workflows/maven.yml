# simply detect the push in main branch and do the job [build the jar and just run..]

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package

    - name: Test Application Startup
      run: |
        java -jar target/jwt_learning-0.0.1-SNAPSHOT.jar &
        APP_PID=$!
        echo "Spring Boot starting up with Process ID: $APP_PID..."
        
        # Give the app 15 seconds to finish its initialization sequence
        sleep 15
        
        # Check if the background process is still alive
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App started successfully!"
          kill $APP_PID # Stop it safely so the runner can successfully finish the job
        else
          echo "App crashed on startup."
          exit 1
        fi
      
   
